name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fetch runtime components
        run: bash tools/fetch_components.sh

      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon assembleModernRelease

      - uses: actions/upload-artifact@v4
        with:
          name: WoW-Forever-apk
          path: app/build/outputs/apk/modern/release/*.apk
