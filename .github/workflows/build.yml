name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Fetch runtime components
        run: |
          sudo apt-get install -y perl >/dev/null
          bash tools/fetch_components.sh

      - name: Build
        run: ./gradlew --no-daemon assembleModernRelease

      - uses: actions/upload-artifact@v4
        with:
          name: WoW-Forever-apk
          path: app/build/outputs/apk/modern/release/*.apk
