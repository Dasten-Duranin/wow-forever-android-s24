name: Build APK (fork)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the NDK
        run: |
          NDK=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" > /dev/null

      - name: Fetch runtime components
        run: tools/fetch_components.sh

      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon testModernReleaseUnitTest --tests "app.gamenative.ui.screen.wow.GpuProfileTest" assembleModernRelease

      - uses: actions/upload-artifact@v4
        with:
          name: WoW-Foreverywhere-apk
          path: app/build/outputs/apk/modern/release/*.apk
